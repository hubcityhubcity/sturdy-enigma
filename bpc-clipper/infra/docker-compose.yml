services:
  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ../services/api:/app
    command: sh -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://bpc:bpc@db:5432/bpc
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=bpc
      - POSTGRES_PASSWORD=bpc
      - POSTGRES_DB=bpc
    ports:
      - "5432:5432"
    volumes:
      - bpc_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  bpc_pg_data:

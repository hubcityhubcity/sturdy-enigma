services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: titan_clipper
      POSTGRES_USER: titan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - titan_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U titan -d titan_clipper"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./services/api
    restart: unless-stopped
    env_file:
      - ./.env.production
    environment:
      DATABASE_URL: postgresql+psycopg://titan:${POSTGRES_PASSWORD}@database:5432/titan_clipper
      STORAGE_ROOT: /data/storage
      WHISPER_DOWNLOAD_ROOT: /data/models
      VISUAL_MODEL_ROOT: /data/visual-models
    ports:
      - "8000:8000"
    volumes:
      - titan_storage:/data/storage
      - titan_models:/data/models
      - titan_visual_models:/data/visual-models
    depends_on:
      database:
        condition: service_healthy

  render-worker:
    build:
      context: ./services/api
    command: ["python", "render_worker.py"]
    restart: unless-stopped
    env_file:
      - ./.env.production
    environment:
      DATABASE_URL: postgresql+psycopg://titan:${POSTGRES_PASSWORD}@database:5432/titan_clipper
      STORAGE_ROOT: /data/storage
    volumes:
      - titan_storage:/data/storage
    depends_on:
      database:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?Set NEXT_PUBLIC_API_BASE_URL in .env.production}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  titan_postgres:
  titan_storage:
  titan_models:
  titan_visual_models:

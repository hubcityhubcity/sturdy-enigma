name: Titan Clipper CI

on:
  pull_request:
    branches:
      - bpc-foundation

  push:
    branches:
      - bpc-foundation
      - titan-clipper-publishing-package

  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: bpc-clipper/services/api

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run API tests
        run: python -m unittest discover -s . -p "test_*.py" -v

  web-build:
    name: Web build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: bpc-clipper/apps/web

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install web dependencies
        run: npm install

      - name: Build web app
        run: set -o pipefail; npm run build 2>&1 | tee build.log

      - name: Upload failed web build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: titan-web-build-log
          path: bpc-clipper/apps/web/build.log
          if-no-files-found: error

  api-container-build:
    name: API container build
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build API and worker image
        run: docker build --tag titan-clipper-api:ci bpc-clipper/services/api

  web-container-build:
    name: Web container build
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build web image
        run: docker build --build-arg NEXT_PUBLIC_API_BASE_URL=https://api.example.com/api/v1 --tag titan-clipper-web:ci bpc-clipper/apps/web

  compose-config:
    name: Production compose validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Validate production stack configuration
        run: docker compose --env-file bpc-clipper/.env.production.example -f bpc-clipper/docker-compose.production.yml config
